apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: podinfo-allow-labeled-clients
spec:
  podSelector:
    matchLabels:
      app: podinfo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: allowed
      ports:
        - protocol: TCP
          port: 9898

